---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: humiorepositories.core.humio.com
  labels:
    app: 'humio-operator'
    app.kubernetes.io/name: 'humio-operator'
    app.kubernetes.io/instance: 'humio-operator'
    app.kubernetes.io/managed-by: 'Helm'
    helm.sh/chart: 'humio-operator-0.0.1'
spec:
  group: core.humio.com
  names:
    kind: HumioRepository
    listKind: HumioRepositoryList
    plural: humiorepositories
    singular: humiorepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The state of the repository
      jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HumioRepository is the Schema for the humiorepositories API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HumioRepositorySpec defines the desired state of HumioRepository.
            properties:
              allowDataDeletion:
                description: |-
                  AllowDataDeletion is used as a blocker in case an operation of the operator would delete data within the
                  repository. This must be set to true before the operator will apply retention settings that will (or might)
                  cause data to be deleted within the repository.
                type: boolean
              automaticSearch:
                description: AutomaticSearch is used to specify the start search automatically
                  on loading the search page option.
                type: boolean
              cascadeRenames:
                default: false
                description: |-
                  CascadeRenames enables automatic cascading of repository name changes to dependent resources
                  (HumioParser, HumioIngestToken, HumioView, HumioEventForwardingRule). When true, renaming this
                  repository will automatically update references in dependent resources. When false (default), rename
                  operations proceed without updating dependent resources, which is safer for GitOps workflows where
                  dependent resource specs are managed in version control.
                type: boolean
              description:
                description: |-
                  Description contains the description that will be set on the repository
                  If nil, the field is not managed by the operator
                type: string
              externalClusterName:
                description: |-
                  ExternalClusterName refers to an object of type HumioExternalCluster where the Humio resources should be created.
                  This conflicts with ManagedClusterName.
                minLength: 1
                type: string
              managedClusterName:
                description: |-
                  ManagedClusterName refers to an object of type HumioCluster that is managed by the operator where the Humio
                  resources should be created.
                  This conflicts with ExternalClusterName.
                minLength: 1
                type: string
              name:
                description: Name is the name of the repository inside Humio
                minLength: 1
                type: string
              retention:
                description: Retention defines the retention settings for the repository
                properties:
                  ingestSizeInGB:
                    description: |-
                      IngestSizeInGB sets the retention size in gigabytes measured at the time of ingest, so that would be the
                      uncompressed size of the data.
                      perhaps we should migrate to resource.Quantity? the Humio API needs float64, but that is not supported here, see more here:
                      https://github.com/kubernetes-sigs/controller-tools/issues/245
                    format: int32
                    minimum: 0
                    type: integer
                  storageSizeInGB:
                    description: |-
                      StorageSizeInGB sets the retention size in gigabytes measured as disk usage. In order words, this is the
                      compressed size.
                    format: int32
                    minimum: 0
                    type: integer
                  timeInDays:
                    description: TimeInDays sets the data retention measured in days.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
            required:
            - name
            type: object
            x-kubernetes-validations:
            - message: Must specify exactly one of managedClusterName or externalClusterName
              rule: (has(self.managedClusterName) && self.managedClusterName != "")
                != (has(self.externalClusterName) && self.externalClusterName != "")
          status:
            description: HumioRepositoryStatus defines the observed state of HumioRepository.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncedName:
                description: |-
                  LastSyncedName is the last name successfully synced with LogScale
                  Used to detect renames
                type: string
              state:
                description: State is deprecated (use Conditions instead). Will be
                  removed in a future release. Reflects the current state of the HumioRepository
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
