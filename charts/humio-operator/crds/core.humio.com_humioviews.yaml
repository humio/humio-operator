metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: humioviews.core.humio.com
  labels:
    app: 'humio-operator'
    app.kubernetes.io/name: 'humio-operator'
    app.kubernetes.io/instance: 'humio-operator'
    app.kubernetes.io/managed-by: 'Helm'
    helm.sh/chart: 'humio-operator-0.0.1'
spec:
  group: core.humio.com
  names:
    kind: HumioView
    listKind: HumioViewList
    plural: humioviews
    singular: humioview
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - description: The state of the view
      jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HumioView is the Schema for the humioviews API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HumioViewSpec defines the desired state of HumioView.
            properties:
              allowDataDeletion:
                description: |-
                  AllowDataDeletion enables deletion of the LogScale resource when this CR is deleted.
                  If false or unset, the operator will not delete the LogScale resource on CR deletion.
                type: boolean
              automaticSearch:
                description: AutomaticSearch is used to specify the start search automatically
                  on loading the search page option.
                type: boolean
              cascadeRenames:
                default: false
                description: |-
                  CascadeRenames enables automatic cascading of view name changes to dependent resources
                  (HumioAlert, HumioAggregateAlert, HumioFilterAlert, HumioScheduledSearch, HumioAction,
                  HumioSavedQuery, HumioMultiClusterSearchView, HumioEventForwardingRule). When true,
                  renaming this view will automatically update references in dependent resources. When false
                  (default), rename operations proceed without updating dependent resources, which is safer
                  for GitOps workflows where dependent resource specs are managed in version control.
                type: boolean
              connections:
                description: Connections contains the connections to the Humio repositories
                  which is accessible in this view
                items:
                  description: HumioViewConnection represents a connection to a specific
                    repository with an optional filter
                  properties:
                    filter:
                      description: Filter contains the prefix filter that will be
                        applied for the given RepositoryName
                      type: string
                    repositoryName:
                      description: RepositoryName contains the name of the target
                        repository
                      minLength: 1
                      type: string
                  required:
                  - repositoryName
                  type: object
                type: array
              description:
                description: Description contains the description that will be set
                  on the view
                type: string
              externalClusterName:
                description: |-
                  ExternalClusterName refers to an object of type HumioExternalCluster where the Humio resources should be created.
                  This conflicts with ManagedClusterName.
                minLength: 1
                type: string
              managedClusterName:
                description: |-
                  ManagedClusterName refers to an object of type HumioCluster that is managed by the operator where the Humio
                  resources should be created.
                  This conflicts with ExternalClusterName.
                minLength: 1
                type: string
              name:
                description: Name is the name of the view inside Humio
                minLength: 1
                type: string
            required:
            - name
            type: object
            x-kubernetes-validations:
            - message: Must specify exactly one of managedClusterName or externalClusterName
              rule: (has(self.managedClusterName) && self.managedClusterName != "")
                != (has(self.externalClusterName) && self.externalClusterName != "")
          status:
            description: HumioViewStatus defines the observed state of HumioView.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncedName:
                description: |-
                  LastSyncedName is the last name successfully synced with LogScale
                  Used to detect renames
                type: string
              state:
                description: State is deprecated (use Conditions instead). Will be
                  removed in a future release. Reflects the current state of the HumioView
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
